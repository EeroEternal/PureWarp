schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_with = "2.0.1"
serde_yaml = "0.8"
sha2 = "0.10"
shellexpand = "3.1.1"
similar = { version = "2.7", features = ["inline"] }
simplelog = "0.12.2"
smallvec = "1.6.1"
smol_str = "0.2.2"
static_assertions = "1.1.0"
strsim = "0.11"
strum = "0.27"
