windows-core = { version = "0.62.2" }
windows-registry = { version = "0.2.0" }
windows-result = { version = "0.2.0" }
winreg = "0.55.0"
winit = { git = "https://github.com/warpdotdev/winit.git", rev = "7ef01853ae3fe952e6014080a88dc4352662dfb1" }
x11rb = "0.13.0"
