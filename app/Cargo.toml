[package]
name = "pure_warp"
version = "0.1.1"
edition = "2021"
description = "A pure terminal emulator, based on Warp's GPU rendering engine, without AI"
authors = ["PureWarp Contributors"]
license = "MIT"
publish = false

[[bin]]
name = "purewarp"
path = "src/main.rs"

[dependencies]
# Core crates
warpui.workspace = true
warpui_core.workspace = true
warp_terminal.workspace = true
warp_core.workspace = true
warp_util.workspace = true
warp_editor.workspace = true
terminal_backend.workspace = true

# External
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures.workspace = true
winit.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
dirs.workspace = true
rust-embed.workspace = true
pathfinder_color.workspace = true
