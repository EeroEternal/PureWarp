walkdir = "2"
wasm-bindgen = "0.2.89"
wasm-bindgen-futures = "0.4.42"
web-sys = { version = "0.3.69", features = [
  "Blob",
  "Clipboard",
  "ClipboardEvent",
  "ClipboardItem",
  "CompositionEvent",
  "Document",
  "DataTransfer",
  "Event",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "InputEvent",
  "Navigator",
  "MediaQueryList",
  "Window",
  "Notification",
  "NotificationPermission",
] }
wgpu = { version = "29.0.1", default-features = false, features = [
  "dx12",
  "gles",
  "metal",
  "parking_lot",
  "std",
  "vulkan",
  "wgsl",
] }
windows = { version = "0.62.2", features = [
  "Win32",
  "Win32_System",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Wdk_System",
  "Wdk_System_SystemServices",
  "Win32_System_Com",
