memo-map = "0.3.1"
nix = { version = "0.26.4", default-features = false, features = ["signal"] }
nom = "7.1.1"
num-traits = "0.2"
objc = "0.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "objc2-core-foundation"] }
